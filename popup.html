<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <title>Ortak Sepet</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="app">
      <header class="header">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M5 8h14l-1.3 10.4a2 2 0 0 1-2 1.6H8.3a2 2 0 0 1-2-1.6Z"></path>
              <path d="M9 8V6a3 3 0 0 1 6 0v2"></path>
            </svg>
          </span>
          <div>
            <h1>Ortak Sepet</h1>
            <p id="appSubtitle"></p>
          </div>
        </div>

        <div class="header-controls">
          <div id="sortControl" class="menu">
            <button
              id="sortBtn"
              class="sort-button"
              type="button"
              aria-haspopup="menu"
              aria-expanded="false"
              aria-controls="sortMenu"
            >
              <svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M7 4v16"></path>
                <path d="m3 16 4 4 4-4"></path>
                <path d="M17 20V4"></path>
                <path d="m13 8 4-4 4 4"></path>
              </svg>
            </button>

            <div id="sortMenu" class="menu-popover" role="menu" hidden>
              <p id="sortMenuTitle" class="popover-title"></p>
              <div id="sortOptions" class="sort-options"></div>
            </div>
          </div>

          <div id="languageControl" class="language-control">
            <button id="languageToggleBtn" class="language-toggle" type="button" aria-label="Dil değiştir">
              <span class="language-code language-code-tr" aria-hidden="true">TR</span>
              <span class="language-code language-code-en" aria-hidden="true">EN</span>
              <span class="language-thumb" aria-hidden="true">
                <svg class="language-flag language-flag-tr" viewBox="0 0 30 20" preserveAspectRatio="xMidYMid slice">
                  <rect width="30" height="20" fill="#e30a17"></rect>
                  <circle cx="12" cy="10" r="5.2" fill="#ffffff"></circle>
                  <circle cx="13.7" cy="10" r="4.2" fill="#e30a17"></circle>
                  <polygon points="18.1,10 20.9,9.1 19.2,11.5 19.2,8.5 20.9,10.9" fill="#ffffff"></polygon>
                </svg>
                <svg class="language-flag language-flag-en" viewBox="0 0 30 20" preserveAspectRatio="xMidYMid slice">
                  <rect width="30" height="20" fill="#012169"></rect>
                  <path d="M0 0 30 20M30 0 0 20" stroke="#ffffff" stroke-width="5"></path>
                  <path d="M0 0 30 20M30 0 0 20" stroke="#c8102e" stroke-width="2"></path>
                  <path d="M15 0v20M0 10h30" stroke="#ffffff" stroke-width="7"></path>
                  <path d="M15 0v20M0 10h30" stroke="#c8102e" stroke-width="4"></path>
                </svg>
              </span>
            </button>
          </div>

          <button id="themeToggleBtn" class="theme-toggle" type="button" aria-label="Tema değiştir">
            <span class="theme-track">
              <span class="theme-half theme-half-light" aria-hidden="true">
                <span class="theme-sky-cloud theme-cloud-one"></span>
                <span class="theme-sky-cloud theme-cloud-two"></span>
              </span>
              <span class="theme-half theme-half-dark" aria-hidden="true">
                <span class="theme-stars"></span>
              </span>
            </span>
            <span class="theme-thumb" aria-hidden="true">
              <span class="theme-thumb-sun"></span>
              <span class="theme-thumb-moon"></span>
            </span>
          </button>
        </div>
      </header>

      <section id="summarySection" class="summary" aria-live="polite">
        <div class="summary-main">
          <div class="summary-heading">
            <span id="selectedTotalPriceLabel" class="summary-label"></span>
            <div id="currencySwitch" class="currency-switch" role="group">
              <button type="button" data-display-currency="TRY"></button>
              <button type="button" data-display-currency="GBP"></button>
              <button type="button" data-display-currency="USD"></button>
              <button type="button" data-display-currency="EUR"></button>
            </div>
          </div>
          <strong id="selectedTotalPrice" class="summary-total">0,00 TL</strong>
          <p id="rateInfo" class="summary-rate" hidden></p>
        </div>
        <div class="summary-meta">
          <div>
            <span id="totalPriceLabel" class="summary-label"></span>
            <strong id="totalPrice">0,00 TL</strong>
          </div>
          <div>
            <span id="itemCountLabel" class="summary-label"></span>
            <strong id="itemCount">0</strong>
          </div>
        </div>
      </section>

      <section id="actionGrid" class="action-bar">
        <div class="action-row">
          <button id="addCurrentProductBtn" class="action-button action-button-primary" type="button">
            <svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 5v14M5 12h14"></path>
            </svg>
            <span class="action-label"></span>
          </button>
          <button id="updateAllPricesBtn" class="action-button" type="button">
            <svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M21 12a9 9 0 0 1-15.5 6.2L3 16"></path>
              <path d="M3 12a9 9 0 0 1 15.5-6.2L21 8"></path>
              <path d="M21 3v5h-5M3 21v-5h5"></path>
            </svg>
            <span class="action-label"></span>
          </button>

          <div class="menu">
            <button
              id="moreActionsBtn"
              class="icon-button"
              type="button"
              aria-haspopup="menu"
              aria-expanded="false"
              aria-controls="moreActionsMenu"
            >
              <svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="5" cy="12" r="1.2"></circle>
                <circle cx="12" cy="12" r="1.2"></circle>
                <circle cx="19" cy="12" r="1.2"></circle>
              </svg>
            </button>

            <div id="moreActionsMenu" class="menu-popover" role="menu" hidden>
              <button id="exportCsvBtn" class="menu-item" type="button" role="menuitem">
                <svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M12 3v12"></path>
                  <path d="m7 10 5 5 5-5"></path>
                  <path d="M5 21h14"></path>
                </svg>
                <span class="action-label"></span>
              </button>
              <button id="backupCartBtn" class="menu-item" type="button" role="menuitem">
                <svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M5 4h11l3 3v13H5z"></path>
                  <path d="M8 4v5h7V4"></path>
                  <path d="M8 20v-6h8v6"></path>
                </svg>
                <span class="action-label"></span>
              </button>
              <button id="restoreCartBtn" class="menu-item" type="button" role="menuitem">
                <svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M12 21V9"></path>
                  <path d="m7 14 5-5 5 5"></path>
                  <path d="M5 4h14"></path>
                </svg>
                <span class="action-label"></span>
              </button>

              <div id="footerActions" class="menu-group">
                <button id="copyCartBtn" class="menu-item" type="button" role="menuitem"></button>
                <button id="clearCartBtn" class="menu-item menu-item-danger" type="button" role="menuitem"></button>
              </div>

              <div class="menu-group menu-theme">
                <p id="accentMenuTitle" class="popover-title"></p>
                <div id="accentSwatches" class="accent-swatches"></div>
                <label class="accent-custom">
                  <span id="accentCustomLabel"></span>
                  <input id="accentHueInput" class="accent-hue" type="range" min="0" max="359" step="1" />
                </label>
              </div>
            </div>
          </div>
        </div>

        <div id="updateProgress" class="progress" hidden>
          <span id="updateProgressBar" class="progress-bar"></span>
        </div>

        <div class="view-row">
          <span id="groupByLabel" class="view-row-label"></span>
          <button id="categorizeProductsBtn" class="chip" type="button" aria-pressed="false">
            <span class="action-label"></span>
          </button>
          <button id="installmentProductsBtn" class="chip" type="button" aria-pressed="false">
            <span class="action-label"></span>
          </button>
          <button id="countryGroupingBtn" class="chip" type="button" aria-pressed="false">
            <span class="action-label"></span>
          </button>

            <button id="compactViewBtn" class="chip chip-compact" type="button" aria-pressed="false">
            <svg class="action-icon compact-toggle-icon" viewBox="0 0 24 24" aria-hidden="true">
              <g class="compact-mode-enter-icon">
                <path d="M4.25 4.25 10.5 10.5"></path>
                <path d="M10.5 5.6v4.9H5.6"></path>
                <path d="M19.75 4.25 13.5 10.5"></path>
                <path d="M18.4 10.5h-4.9V5.6"></path>
                <path d="M4.25 19.75 10.5 13.5"></path>
                <path d="M5.6 13.5h4.9v4.9"></path>
                <path d="M19.75 19.75 13.5 13.5"></path>
                <path d="M13.5 18.4v-4.9h4.9"></path>
              </g>
              <g class="compact-mode-exit-icon">
                <path d="M10.5 10.5 4.25 4.25"></path>
                <path d="M4.25 9.15v-4.9h4.9"></path>
                <path d="M13.5 10.5 19.75 4.25"></path>
                <path d="M14.85 4.25h4.9v4.9"></path>
                <path d="M10.5 13.5 4.25 19.75"></path>
                <path d="M4.25 14.85v4.9h4.9"></path>
                <path d="M13.5 13.5 19.75 19.75"></path>
                <path d="M14.85 19.75h4.9v-4.9"></path>
              </g>
            </svg>
            <span class="action-label"></span>
          </button>

        </div>
      </section>

      <section class="cart-section">
        <div class="cart-tabs" role="tablist">
          <button
            id="cartTabBtn"
            class="cart-tab is-active"
            type="button"
            role="tab"
            aria-selected="true"
            aria-controls="cartPanel"
          ></button>
          <button
            id="purchasedTabBtn"
            class="cart-tab"
            type="button"
            role="tab"
            aria-selected="false"
            aria-controls="purchasedPanel"
          ></button>
        </div>

        <div id="cartPanel" role="tabpanel" aria-labelledby="cartTabBtn">
          <div id="permissionNotice" class="permission-notice" role="status" aria-live="polite" hidden></div>
          <div id="cartItems" class="item-list"></div>
          <button id="markPurchasedBtn" class="mark-purchased-button" type="button"></button>
        </div>

        <div id="purchasedPanel" role="tabpanel" aria-labelledby="purchasedTabBtn" hidden>
          <div id="purchasedSummary" class="purchased-summary"></div>
          <div id="purchasedItems" class="item-list"></div>
        </div>
      </section>

      <div class="status-row">
        <p id="status" class="status" role="status" aria-live="polite"></p>
        <button id="undoBtn" class="undo-button" type="button" hidden></button>
        <button id="dismissStatusBtn" class="status-close" type="button">
          <svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 6l12 12M18 6 6 18"></path>
          </svg>
        </button>
      </div>
    </main>

    <script src="browser-polyfill.js"></script>
    <script src="shared/category.js"></script>
    <script src="shared/cart.js"></script>
    <script src="shared/backup.js"></script>
    <script src="popup/config.js"></script>
    <script src="popup/i18n.js"></script>
    <script src="popup/state.js"></script>
    <script src="popup/totals.js"></script>
    <script src="popup/rates.js"></script>
    <script src="popup/render.js"></script>
    <script src="popup/media.js"></script>
    <script src="popup/actions.js"></script>
    <script src="popup/export.js"></script>
    <script src="popup/init.js"></script>
  </body>
</html>
